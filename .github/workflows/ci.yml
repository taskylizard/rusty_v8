name: crates-publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: false

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Publish to crates.io (retry)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if cargo publish -vv --locked; then
              exit 0
            fi
            sleep_seconds=$((attempt * 15))
            echo "cargo publish failed (attempt ${attempt}); sleeping ${sleep_seconds}s then retrying..." >&2
            sleep "$sleep_seconds"
          done

          echo "cargo publish failed after retries" >&2
          exit 1
